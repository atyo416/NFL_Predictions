[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nfl-predictor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["nflreadpy>=0.1", "polars", "pandas", "numpy", "scikit-learn>=1.3", "streamlit", "pyarrow", "joblib", "matplotlib"]
[project.optional-dependencies]
test = ["pytest"]
[tool.setuptools.packages.find]
include = ["nfl_predictor*"]
[tool.pytest.ini_options]
pythonpath = ["."]
